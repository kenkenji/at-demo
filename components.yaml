version: "2"
model:
  type: "c4"
components:
  # Software System
  - id: task-app
    name: "Task Management App"
    level: system
    description: "チーム向けタスク管理アプリケーション"
    tags: [internal]

  - id: external-mail
    name: "Email Service"
    level: system
    description: "外部メール送信サービス（SendGrid等）"
    tags: [external]

  # Container
  - id: web-frontend
    name: "Web Frontend"
    level: container
    parent: task-app
    technology: "React + TypeScript"
    description: "ブラウザ上で動作するSPA"
    tags: [frontend]

  - id: api-server
    name: "API Server"
    level: container
    parent: task-app
    technology: "Node.js + Express"
    description: "REST APIを提供するバックエンド"
    tags: [backend]

  - id: database
    name: "Database"
    level: container
    parent: task-app
    technology: "PostgreSQL"
    description: "タスク・ユーザーデータの永続化"
    tags: [storage]

  # Component
  - id: auth-module
    name: "Auth Module"
    level: component
    parent: api-server
    technology: "Passport.js"
    description: "認証・認可処理"
    tags: [security]

  - id: task-service
    name: "Task Service"
    level: component
    parent: api-server
    technology: "Express Router"
    description: "タスクCRUDのビジネスロジック"
    tags: [core]

relations:
  - from: web-frontend
    to: api-server
    description: "APIリクエスト"
    technology: "HTTPS/REST"

  - from: api-server
    to: database
    description: "データ読み書き"
    technology: "SQL (pg driver)"

  - from: api-server
    to: external-mail
    description: "通知メール送信"
    technology: "SMTP / SendGrid API"
